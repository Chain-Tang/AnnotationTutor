name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser extension uses its own Chrome types and npm lockfile.
      - run: npm --prefix extension ci
      - run: pnpm typecheck
      - run: pnpm test
        if: runner.os != 'Linux'
      - run: pnpm test:coverage
        if: runner.os == 'Linux'
      - run: pnpm test:release
      # Packaging builds both plugin and extension under the release lock.
      - run: pnpm package
      - run: pnpm package:verify
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ github.sha }}
          path: |
            dist/annotation-tutor-lite-*.zip
            dist/package-verification.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
