<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Web Clipper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="wrap">
      <header class="brand">
        <img class="brand-icon" src="icon-48.png" width="48" height="48" alt="" />
        <div class="brand-copy">
          <h1 id="title" class="title">Web Clipper</h1>
          <p id="status" class="status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">Connecting to Tutor</span>
          </p>
        </div>
      </header>

      <section class="capture" aria-labelledby="clip-page">
        <button id="clip-page" class="primary" type="button">Clip whole page</button>
        <p id="clip-hint" class="hint">Sends the article body as Markdown plus raw HTML.</p>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <section class="highlights" aria-labelledby="hl-title">
        <div class="hl-head">
          <h2 id="hl-title" class="section-title">Highlights on this page</h2>
          <span class="hl-head-actions">
            <button id="hl-sync" class="link" type="button">Sync all</button>
            <button id="hl-clear" class="link" type="button">Clear all</button>
          </span>
        </div>
        <ul id="hl-list" class="hl-list"></ul>
        <div id="hl-empty" class="empty-state">
          <img class="empty-icon" src="empty-highlights.png" width="48" height="48" alt="" />
          <p id="hl-empty-title" class="empty-title">No highlights on this page yet</p>
          <p id="hl-empty-hint" class="empty-hint">Select text on the page to highlight or annotate it.</p>
        </div>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <section class="connection" aria-labelledby="connection-title">
        <div class="connection-copy">
          <h2 id="connection-title" class="connection-title">Tutor connection</h2>
          <p id="connection-help" class="connection-help">Tutor discovers and configures the local bridge automatically.</p>
        </div>
        <button id="connect" class="secondary" type="button">Reconnect</button>
      </section>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
